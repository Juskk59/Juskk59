    <circle class="orb o2" cx="720" cy="230" r="140" fill="#a855f7" opacity="0.35"/>
    <circle class="orb o3" cx="480" cy="-10" r="110" fill="#d946ef" opacity="0.22"/>
  </g>
</g>

<g class="rise" transform="translate(48 52)">
