  <g class="float">
    <rect width="292" height="196" rx="14" fill="#151021" fill-opacity="0.92" stroke="#2a1f3d"/>
    <rect width="292" height="34" rx="14" fill="#1c1530"/>
    <rect y="20" width="292" height="14" fill="#1c1530"/>
