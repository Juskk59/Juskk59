<text x="24" y="108" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" class="rise" style="animation-delay:0.84s"><tspan fill="#8b80a8">&#160;&#160;</tspan><tspan fill="#e9d5ff">stack</tspan><tspan fill="#8b80a8">:&#160;[</tspan><tspan fill="#a5b4fc">&#39;PHP&#39;</tspan><tspan fill="#8b80a8">,&#160;</tspan><tspan fill="#a5b4fc">&#39;JS&#39;</tspan><tspan fill="#8b80a8">,&#160;</tspan><tspan fill="#a5b4fc">&#39;Python&#39;</tspan><tspan fill="#8b80a8">],</tspan></text>
<text x="24" y="129" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" class="rise" style="animation-delay:0.96s"><tspan fill="#8b80a8">&#160;&#160;</tspan><tspan fill="#e9d5ff">based</tspan><tspan fill="#8b80a8">:&#160;</tspan><tspan fill="#a5b4fc">&#39;Londrina,&#160;BR&#39;</tspan><tspan fill="#8b80a8">,</tspan></text>
<text x="24" y="150" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" class="rise" style="animation-delay:1.08s"><tspan fill="#8b80a8">&#160;&#160;</tspan><tspan fill="#e9d5ff">learning</tspan><tspan fill="#8b80a8">:&#160;</tspan><tspan fill="#f0abfc">true</tspan><tspan fill="#8b80a8">,</tspan></text>
<text x="24" y="171" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" class="rise" style="animation-delay:1.20s"><tspan fill="#8b80a8">};</tspan></text>
