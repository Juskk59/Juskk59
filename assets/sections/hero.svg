</g>

<g class="rise" style="animation-delay:0.15s">
  <g clip-path="url(#name)">
    <rect x="40" y="90" width="560" height="60" fill="url(#g-name)"/>
    <rect x="0" y="90" width="160" height="60" fill="url(#g-shine)" class="shine" opacity="0.6"/>
  </g>
</g>
<text x="50" y="176" fill="#c9bfe6" font-size="21" font-weight="600" class="rise" style="animation-delay:0.30s">Junior Full Stack Developer</text>
<g transform="translate(50 214)" class="rise" style="animation-delay:0.45s">
  <text x="0" y="0" fill="#8b80a8" font-size="17">I like building</text>
  <text x="112" y="0" class="word w0" style="animation-delay:0s" fill="url(#g-word)" font-size="17" font-weight="700">front ends</text><text x="112" y="0" class="word w1" style="animation-delay:3s" fill="url(#g-word)" font-size="17" font-weight="700">back ends</text><text x="112" y="0" class="word w2" style="animation-delay:6s" fill="url(#g-word)" font-size="17" font-weight="700">integrations</text><text x="112" y="0" class="word w3" style="animation-delay:9s" fill="url(#g-word)" font-size="17" font-weight="700">automations</text>
</g>
<text x="50" y="256" fill="#8b80a8" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" class="rise" style="animation-delay:0.60s">PHP  ·  JavaScript  ·  Python  ·  SQL</text>

