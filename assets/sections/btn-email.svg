<rect x="1" y="1" width="198" height="50" rx="15" fill="url(#g-btn)"/>
<g class="rise">
  <g transform="translate(22 14) scale(1)"><rect x="2" y="4.5" width="20" height="15" rx="3" stroke="#c084fc" stroke-width="2"/><path d="M3 7l9 6.5L21 7" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="58" y="31" fill="#ede9fe" font-size="15" font-weight="700">Email</text>
  <text x="176" y="31" text-anchor="end" fill="#c084fc" font-size="15">↗</text>
</g>
</svg>
