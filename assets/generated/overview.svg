  </radialGradient>
  
</defs>
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', -apple-system, sans-serif; }
  .t { fill: #ede9fe; font-size: 16px; font-weight: 700; }
  .s { fill: #8b80a8; font-size: 11px; }
  .lbl { fill: #8b80a8; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
  .val { fill: #ede9fe; font-size: 16px; font-weight: 700; font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .fade { animation: fade 0.6s ease-out both; }
  .reveal { transform-box: view-box; transform-origin: 0 0; animation: reveal 1.6s cubic-bezier(0.3, 0, 0.2, 1) 0.2s both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes reveal { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .fade, .reveal { animation: none; } }
</style>
<rect x="0.5" y="0.5" width="419" height="229" rx="14" fill="#0d0b14" stroke="#2a1f3d"/>
<rect x="0.5" y="0.5" width="419" height="229" rx="14" fill="url(#g-glow)"/>

