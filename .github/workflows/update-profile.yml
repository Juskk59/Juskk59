name: Update profile visuals

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 in Brazil (UTC-3)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Classic PAT with scopes: repo, read:org.
      # Needed so contributions to private (work) repositories are counted.
      PROFILE_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats cards
        run: node scripts/generate-cards.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ env.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898276+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if git commit -m "chore: update profile visuals [skip ci]"; then
            git push
          fi
